<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e2329; width: 600px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .label { color: #848e9c; font-size: 14px; margin-bottom: 5px; }
        .balance { font-size: 36px; font-weight: bold; color: #fff; margin-bottom: 25px; }
        .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .btn { background: #2b3139; color: #eaecef; padding: 12px 5px; border-radius: 6px; text-align: center; cursor: pointer; font-size: 13px; transition: 0.3s; border: none; }
        .btn:hover { background: #363c46; }
        .footer-line { margin-top: 30px; border-top: 1px solid #363c46; padding-top: 15px; color: #848e9c; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <div class="label">إجمالي الأصول (بالدولار الأمريكي)</div>
    <div class="balance" id="balance">7,642,720.00</div>
    
    <div class="actions">
        <button class="btn">إيداع</button>
        <button class="btn">سحب</button>
        <button class="btn" onclick="transfer()">تحويل</button>
        <button class="btn">تحويل عملات</button>
    </div>

    <div class="footer-line">تحليل المحفظة الاستثمارية</div>
</div>

<script>
    function transfer() {
        let address = prompt("يرجى إدخال عنوان محفظة Bybit:");
        if (address) {
            let amount = prompt("أدخل المبلغ المراد تحويله:");
            if (amount) {
                alert("جاري الاتصال بشبكة Bybit...");
                setTimeout(() => {
                    let el = document.getElementById('balance');
                    let val = parseFloat(el.innerHTML.replace(/,/g, ''));
                    el.innerHTML = (val - parseFloat(amount)).toLocaleString(undefined, {minimumFractionDigits: 2});
                    alert("تم الإرسال بنجاح إلى Bybit.");
                }, 1500);
            }
        }
    }
</script>

</body>
</html>
