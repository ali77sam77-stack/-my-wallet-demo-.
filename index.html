<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { background-color: #1a1e23; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; padding-top: 50px; }
        .bybit-card { background-color: #161a1e; width: 800px; padding: 20px; border-radius: 10px; border: 1px solid #333; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .balance { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .actions { display: flex; gap: 10px; margin: 20px 0; }
        .action-btn { flex: 1; background: #252a31; padding: 15px; text-align: center; border-radius: 5px; cursor: pointer; border: 1px solid #333; }
        .action-btn:hover { background: #2f3640; }
        .highlight { color: #f7b500; }
    </style>
</head>
<body>

<div class="bybit-card">
    <div class="header">
        <span>Total Assets (USDT)</span>
        <span class="highlight">Bybit</span>
    </div>
    <div class="balance" id="balance">7,642,720.00</div>
    
    <div class="actions">
        <div class="action-btn">Deposit</div>
        <div class="action-btn">Withdraw</div>
        <div class="action-btn" onclick="transfer()">Transfer</div>
        <div class="action-btn">Convert</div>
    </div>
    
    <div style="border-top: 1px solid #333; padding-top: 20px;">
        <p>Portfolio Breakdown</p>
        <div style="height: 10px; background: #333; border-radius: 5px;"></div>
    </div>
</div>

<script>
    function transfer() {
        let address = prompt("Enter Wallet Address:");
        if (address) {
            let amount = prompt("Enter Amount (USDT):");
            if (amount) {
                alert("Processing transaction to: " + address);
                setTimeout(() => {
                    let el = document.getElementById('balance');
                    let current = parseFloat(el.innerHTML.replace(/,/g, ''));
                    el.innerHTML = (current - parseFloat(amount)).toLocaleString(undefined, {minimumFractionDigits: 2});
                    alert("Transfer Successful!");
                }, 2000);
            }
        }
    }
</script>

</body>
</html>
